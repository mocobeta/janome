[project]
name = "janome"
description = "Janome is a Japanese morphological analysis engine written in pure Python."
readme = "README.rst"
authors = [
    { name = "Tomoko Uchida", email = "tomoko.uchida.1111@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/mocobeta/janome"
Issues = "https://github.com/mocobeta/janome/issues"
Documentation = "https://janome.mocobeta.dev/en/"
Source = "https://github.com/mocobeta/janome"

[project.scripts]
janome = "janome:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/janome/version.py"
pattern = "^JANOME_VERSION = '(?P<version>.+)'$"

[tool.hatch.build.targets.sdist]
include = [
    "src/janome/**",
    "ipadic/sysdic.zip",
]

[tool.hatch.build.targets.wheel]
packages = ["src/janome"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "coverage>=7.14.0",
    "hatchling>=1.29.0",
    "mypy>=2.1.0",
    "psutil>=7.2.2",
    "ruff>=0.17.4",
]

[tool.coverage.run]
relative_files = true
omit = ["src/janome/sysdic/*", "tests/*"]

[tool.mypy]

[[tool.mypy.overrides]]
module = "janome.sysdic.*"
ignore_errors = true

[tool.ruff]
line-length = 120
extend-exclude = ["docs", "sysdic", "work", "mecab-ipadic-2.7.0-20070801", "benchmark"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
ignore = ["W605"]

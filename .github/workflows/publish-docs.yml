name: Publish documentation

on:
  pull_request_target:
    types: [closed]
    branches: [master]
    paths:
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: publish-docs-master
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with base-repository privileges. Only check
      # out trusted master code after merge; never execute the PR head.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: astral-sh/setup-uv@v5

      - name: Build documentation
        run: |
          uv run --group docs sphinx-build -b html docs/api docs/api/_build/html
          uv run --group docs sphinx-build -b html docs/ja docs/ja/_build/html
          uv run --group docs sphinx-build -b html docs/en docs/en/_build/html

      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: mocobeta/mocobeta.github.io
          ref: master
          token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          path: website

      - name: Update and publish documentation
        env:
          DOCS_ROOT_PATH: ${{ github.workspace }}/website/janome
        run: |
          set -euo pipefail
          mkdir -p "$DOCS_ROOT_PATH/api" "$DOCS_ROOT_PATH/en"
          rsync -a --delete \
            --exclude='/.buildinfo' --exclude='/.doctrees/' \
            --exclude='/.gitignore' --exclude='/index.md' \
            --exclude='/api/' --exclude='/en/' \
            docs/ja/_build/html/ "$DOCS_ROOT_PATH/"
          rsync -a --delete \
            --exclude='/.buildinfo' --exclude='/.doctrees/' \
            --exclude='/.gitignore' --exclude='/index.md' \
            docs/api/_build/html/ "$DOCS_ROOT_PATH/api/"
          rsync -a --delete \
            --exclude='/.buildinfo' --exclude='/.doctrees/' \
            --exclude='/.gitignore' --exclude='/index.md' \
            docs/en/_build/html/ "$DOCS_ROOT_PATH/en/"

          git -C website add janome
          if git -C website diff --cached --quiet; then
            echo "Documentation is already up to date."
            exit 0
          fi

          git -C website config user.name "github-actions[bot]"
          git -C website config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C website commit -m "Update documentation"
          git -C website pull --rebase origin master
          git -C website push origin master
